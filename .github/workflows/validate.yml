name: Validate

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Immutable commit to validate for a release
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  python:
    name: Python and offline tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m ruff check custom_components scripts tests
      - run: python -m ruff format --check custom_components scripts tests
      - run: python -m pytest
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Check bundled JavaScript syntax
        run: |
          node --check custom_components/viaggiatreno/static/viaggiatreno-card.js

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361

  catalog:
    name: Marketplace catalog checks (HACS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate repository without ignored checks
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        env:
          REPOSITORY_REF: ${{ inputs.ref || github.sha }}
        with:
          category: integration
          comment: "false"

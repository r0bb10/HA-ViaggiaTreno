name: Release

on:
  push:
    tags: ["[0-9]*", "v[0-9]*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag; manifest version must already match
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  source:
    name: Resolve immutable release source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      tag: ${{ steps.metadata.outputs.tag }}
      filename: ${{ steps.metadata.outputs.filename }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Verify tag source
        id: source
        shell: python
        run: |
          import os
          from pathlib import Path
          import subprocess

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          commit = git("rev-parse", "HEAD")
          if os.environ["GITHUB_EVENT_NAME"] == "push":
              expected = git("rev-parse", os.environ["GITHUB_SHA"] + "^{commit}")
              if commit != expected:
                  raise SystemExit("Tag moved after the triggering push")
          subprocess.run(["git", "diff", "--exit-code", "HEAD"], check=True)
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write(f"commit={commit}\n")
      - name: Check metadata without rewriting versions
        id: metadata
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        shell: python
        run: |
          import os
          import subprocess

          subprocess.run([
              "python", "-m", "scripts.build_release", "--metadata-only",
              "--tag", os.environ["RELEASE_TAG"],
          ], check=True)

  validate:
    needs: source
    uses: ./.github/workflows/validate.yml
    with:
      ref: ${{ needs.source.outputs.commit }}

  build:
    name: Build validated artifact
    needs: [source, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Build component-only ZIP
        env:
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
        shell: python
        run: |
          import os
          import subprocess

          subprocess.run([
              "python", "-m", "scripts.build_release", "--tag", os.environ["RELEASE_TAG"],
              "--output-dir", os.environ["RUNNER_TEMP"] + "/release",
          ], check=True)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-release
          path: ${{ runner.temp }}/release/${{ needs.source.outputs.filename }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish the exact validated artifact
    needs: [source, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: integration-release
          path: release
      - name: Recheck tag and publish without replacing an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.source.outputs.commit }}
          RELEASE_FILENAME: ${{ needs.source.outputs.filename }}
        shell: python
        run: |
          import os
          import subprocess

          subprocess.run([
              "python", "-m", "scripts.publish_release",
              "--asset", "release/" + os.environ["RELEASE_FILENAME"],
          ], check=True)

name: Validate and release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Validate and package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      commit: ${{ steps.metadata.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Determine and validate release version
        id: metadata
        env:
          PUSH_TAG: ${{ github.ref_name }}
        run: |
          args=(--check-only --github-output "$GITHUB_OUTPUT")
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            args+=(--tag "$PUSH_TAG")
          fi
          python scripts/build_release.py "${args[@]}"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Install lint tools
        run: python -m pip install --disable-pip-version-check ruff==0.17.3
      - name: Lint Python
        run: ruff check --isolated --target-version py314 --select E,F,I,UP,B,ASYNC custom_components scripts/build_release.py
      - name: Check Python formatting
        run: ruff format --isolated --target-version py314 --check custom_components scripts/build_release.py
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Check card JavaScript
        run: node --check custom_components/viaggiatreno/static/viaggiatreno-card.js
      - name: Validate integration with Hassfest
        uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361
      - name: Build HACS ZIP
        env:
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: python scripts/build_release.py --tag "$RELEASE_TAG"
      - name: Upload validated release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hacs-release
          path: dist/viaggiatreno.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub release
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download validated release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hacs-release
          path: dist
      - name: Create draft, attach files, and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          set -euo pipefail
          # Create a missing tag only after validation; never move an existing tag.
          if object=$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" \
            --jq '.object | [.type, .sha] | @tsv' 2>/dev/null); then
            read -r type sha <<< "$object"
            while [[ "$type" == "tag" ]]; do
              object=$(gh api "repos/$GH_REPO/git/tags/$sha" --jq '.object | [.type, .sha] | @tsv')
              read -r type sha <<< "$object"
            done
            if [[ "$type" != "commit" || "$sha" != "$RELEASE_COMMIT" ]]; then
              echo "::error::Tag already points to a different commit; bump the manifest version."
              exit 1
            fi
          else
            gh api --method POST "repos/$GH_REPO/git/refs" \
              -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$RELEASE_COMMIT" > /dev/null
          fi
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' 2>/dev/null); then
            if [[ "$draft" != "true" ]]; then
              echo "::error::Release already published; refusing to overwrite it."
              exit 1
            fi
            gh release upload "$RELEASE_TAG" dist/viaggiatreno.zip --clobber
          else
            gh release create "$RELEASE_TAG" dist/viaggiatreno.zip \
              --verify-tag --draft --generate-notes --title "ViaggiaTreno $RELEASE_TAG"
          fi
          gh release edit "$RELEASE_TAG" --draft=false --latest
